<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wild Guess</title>
<meta name="description" content="We name a species, you pick its photo out of four. Ten rounds, harder every round, a leaderboard for each mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one field-notebook column; the bird's name is the headline, four photo tiles answer it. */
:root{
  --paper:#EEF1EA; --card:#F9FBF7; --ink:#162320; --muted:#59695F; --line:#CDD6CC;
  --accent:#E3B716; --accent-ink:#1A1A0A; --good:#2E7A4C; --bad:#B4432E;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111916; --card:#18221E; --ink:#E5ECE6; --muted:#93A49B; --line:#2A3832;
  --accent:#E9C22E; --accent-ink:#1A1A0A; --good:#5EC08A; --bad:#E57E66; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111916; --card:#18221E; --ink:#E5ECE6; --muted:#93A49B; --line:#2A3832;
  --accent:#E9C22E; --accent-ink:#1A1A0A; --good:#5EC08A; --bad:#E57E66; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:800 20px/1 var(--display);letter-spacing:-.01em}
:root[data-mode="fish"]{--accent:#35C2B5}
@media (prefers-color-scheme: dark){:root[data-mode="fish"]:not([data-theme="light"]){--accent:#43D1C3}}
:root[data-mode="fish"][data-theme="dark"]{--accent:#43D1C3}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:0;border-radius:6px;padding:18px 18px 16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s, transform .15s}
.mode:hover{box-shadow:inset 0 0 0 2px var(--ink);transform:translateY(-1px)}
.mode strong{font:800 clamp(24px,5vw,32px)/1 var(--display);letter-spacing:-.02em}
.mode span{font-size:14px;color:var(--muted)}
.mode i{font-style:normal;font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:3px;color:#1A1A0A}
.mode.birds i{background:#E3B716} .mode.fish i{background:#35C2B5}
.seg{display:inline-flex;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:3px;font:700 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.board .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.brand b{background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:3px;margin-right:2px}
.scorebox{display:flex;gap:16px;align-items:baseline}
.scorebox .mono{font-size:20px;font-weight:700}

/* round track */
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.track span{height:8px;border-radius:2px;background:var(--line)}
.track span.now{background:var(--ink)}
.track span.ok{background:var(--good)}
.track span.miss{background:var(--bad)}

/* prompt */
.prompt{display:flex;flex-direction:column;gap:6px}
.prompt .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tier{font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid var(--line)}
.tier.t3,.tier.t4{background:var(--ink);color:var(--paper);border-color:var(--ink)}
h1.name{font:800 clamp(32px,7vw,54px)/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sci{font-style:italic;color:var(--muted);min-height:1.5em}

.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transform-origin:left;width:100%}

/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:6px;overflow:hidden;background:var(--line);
  box-shadow:0 0 0 1px var(--line)}
/* --s/--o: per-photo crop that pushes a caption or watermark off one edge of the tile */
.tile img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--s,1));transform-origin:var(--o,50% 50%);transition:transform .25s ease, filter .25s}
.tile:hover:not(:disabled) img{transform:scale(calc(var(--s,1) * 1.03))}
.tile .key{position:absolute;top:8px;left:8px;font:700 12px/1 var(--mono);background:var(--card);color:var(--ink);
  width:22px;height:22px;display:grid;place-items:center;border-radius:3px;opacity:.9}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:22px 10px 8px;font-weight:700;font-size:14px;line-height:1.2;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.78));text-align:left;opacity:0;transition:opacity .2s}
.tile:disabled{cursor:default}
.revealed .tile .cap{opacity:1}
.revealed .tile:not(.right):not(.wrong) img{filter:grayscale(.7) brightness(.8)}
.tile.right{box-shadow:0 0 0 4px var(--good)}
.tile.wrong{box-shadow:0 0 0 4px var(--bad)}
.tile .badge{position:absolute;top:8px;right:8px;font:700 12px/1 var(--mono);padding:5px 7px;border-radius:3px;color:#fff}
.tile.right .badge{background:var(--good)} .tile.wrong .badge{background:var(--bad)}

.feedback{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:44px}
.verdict{font:800 22px/1.1 var(--display)}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.credit{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}

.btn{background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:12px 18px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.big{font:800 20px/1 var(--display);padding:16px 26px;background:var(--accent);color:var(--accent-ink)}

/* start / end */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero h1{font:800 clamp(44px,11vw,84px)/.92 var(--display);letter-spacing:-.03em;margin:0}
.hero h1 em{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 .12em;border-radius:4px}
.hero p{max-width:52ch;margin:0;color:var(--muted);font-size:17px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.steps div{border-top:2px solid var(--ink);padding-top:8px;font-size:14px;min-width:0}
.steps strong{display:block;font:800 17px/1.2 var(--display)}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

.board{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.board h2{margin:0;font:800 18px/1.2 var(--display)}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.board li:first-child{border-top:0}
.board li.me{font-weight:700}
.board li .r{color:var(--muted)}
.board .note{font-size:13px;color:var(--muted)}

.postform{display:flex;flex-direction:column;gap:8px}
.postform input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:11px 12px;flex:1 1 180px;min-width:0}
.postform input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode:disabled{cursor:default;opacity:.75;transform:none}
.mode:disabled:hover{box-shadow:inset 0 0 0 1.5px var(--line)}
.practice{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:12px}
.practice > div:first-child{display:flex;flex-direction:column;gap:2px}
.practice strong{font:800 18px/1.2 var(--display)}
.squares{display:flex;gap:4px}
.squares i{width:22px;height:22px;border-radius:3px;background:var(--bad)}
.squares i.ok{background:var(--good)}
.share{display:flex;flex-direction:column;gap:10px}
.share pre{margin:0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:6px;font:500 14px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.board > .note{margin:-4px 0 4px}
.whoami{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.whoami .note{margin:0}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:2px;font:inherit;cursor:pointer}
.askname{font:800 clamp(26px,6vw,36px)/1.1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.final{font:800 clamp(56px,14vw,96px)/1 var(--display);letter-spacing:-.03em}
.log{width:100%;border-collapse:collapse;font-size:14px}
.log td{padding:6px 4px;border-top:1px solid var(--line)}
.log td:last-child{text-align:right}
.log .x{color:var(--bad)} .log .y{color:var(--good)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* Wild Guess: one shared daily quiz per mode (from /api/daily) plus unlimited practice runs built in the browser. */
let SPECIES = [];   /* practice only: loaded per mode from data/<mode>.json */
/* crop: edge letter + percent of the tile to cut, e.g. "b18" trims the bottom 18% (caption bands, watermarks) */
const CROP_ORIGIN = {b:"50% 0%", t:"50% 100%", l:"100% 50%", r:"0% 50%"};
function cropStyle(c){
  const m = /^([btlr])(\d{1,2})$/.exec(c || "");
  return m ? `--s:${(100/(100 - +m[2])).toFixed(3)};--o:${CROP_ORIGIN[m[1]]}` : "";
}
const PHOTO = id => "https://inaturalist-open-data.s3.amazonaws.com/photos/" + id.replace(".", "/medium.");
const ROUNDS = 10, SECONDS = 15, SITE = "wildguess.vercel.app";
const MODES = {
  birds: {label:"Birds", emoji:"🦜", count:658, blurb:"From backyard robins to birds-of-paradise"},
  fish:  {label:"Fish",  emoji:"🐠", count:403,  blurb:"From bluegill to leafy seadragons"}
};
const named = m => `${MODES[m].emoji} ${MODES[m].label}`;
const TIERS = {1:"Warm-up",2:"Field",3:"Tricky",4:"Expert"};
const app = document.getElementById("app");
const rand = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};
const dayLabel = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", {month:"short", day:"numeric", timeZone:"UTC"});
function untilText(ms){ const h = Math.floor(ms/3600e3), m = Math.floor(ms%3600e3/60e3); return h ? `${h}h ${m}m` : `${m}m`; }
/* The leaderboard name lives in a cookie (wg_name) for a year; older saved names are moved into it once. */
const validName = n => { n = String(n || "").trim(); return n.length > 0 && n.length <= 20 && /[\p{L}\p{N}]/u.test(n); };
function readNameCookie(){ const m = document.cookie.match(/(?:^|;\s*)wg_name=([^;]*)/); try { return m ? decodeURIComponent(m[1]) : ""; } catch(e) { return ""; } }
function saveName(n){ myName = n.trim(); document.cookie = `wg_name=${encodeURIComponent(myName)}; Path=/; Max-Age=31536000; SameSite=Lax${location.protocol === "https:" ? "; Secure" : ""}`; }
let myName = readNameCookie();
if (!myName) { let old = ""; try { old = store.get("wg-name") || localStorage.getItem("fw-name") || ""; } catch(e) {} if (validName(old)) saveName(old); }
let mode = ["birds","fish"].includes(store.get("wg-mode")) ? store.get("wg-mode") : "birds";
function setMode(m){ mode = m; document.documentElement.dataset.mode = m; store.set("wg-mode", m); }

/* ---------- today's quizzes ---------- */
const daily = {};            // mode -> {day, msLeft, status, quiz, loadedAt}
async function loadDaily(m){
  const r = await fetch("/api/daily?mode=" + m, {cache:"no-store"});
  if (!r.ok) throw new Error(r.status);
  const j = await r.json(); j.loadedAt = Date.now(); daily[m] = j; return j;
}
/* Local progress for today's run, so a reload resumes instead of starting over. */
const runKey = m => "wg-daily-" + m;
function todaysRun(m){ const s = store.get(runKey(m)); return s && daily[m] && s.day === daily[m].day ? s : null; }
function saveRun(){ if (run && run.kind === "daily") store.set(runKey(run.mode), {day:run.day, i:run.i, score:run.score, log:run.log, pending:run.pending, done:run.done, posted:run.posted, postedName:run.postedName, postFailed:run.postFailed}); }

/* ---------- practice rounds (random, built here) ---------- */
const PLAN = [
  {tiers:[1],same:0,label:1},{tiers:[1],same:0,label:1},{tiers:[1],same:1,label:1},
  {tiers:[2],same:1,label:2},{tiers:[2],same:2,label:2},{tiers:[2,3],same:2,label:2},
  {tiers:[2,3],same:3,label:3},{tiers:[3],same:3,label:3},{tiers:[3],same:3,label:4},{tiers:[3],same:3,label:4}
];
function familyOf(f){ return SPECIES.filter(b => b.family === f); }
const toOption = (b, p) => ({bird:{name:b.name, sci:b.sci}, photo:{src:PHOTO(p[0]), credit:p[1], crop:p[2] || ""}});
function buildPracticeRound(r, used){
  const p = PLAN[r];
  let pool = SPECIES.filter(b => !used.has(b.name) && p.tiers.includes(b.tier) &&
    (p.same === 0 || (b.family !== "misc" && familyOf(b.family).length - 1 >= p.same)));
  if (!pool.length) pool = SPECIES.filter(b => !used.has(b.name) && b.family !== "misc");
  const target = rand(pool);
  const kin = shuffle(familyOf(target.family).filter(b => b !== target)).sort((a,b) => b.tier - a.tier).slice(0, p.same + 1);
  const same = shuffle(kin).slice(0, p.same);
  const others = shuffle(SPECIES.filter(b => b.family !== target.family || target.family === "misc"))
    .filter(b => b !== target && !same.includes(b)).slice(0, 3 - same.length);
  const options = shuffle([target, ...same, ...others]).map(b => toOption(b, rand(b.ph)));
  return {target:options.find(o => o.bird.name === target.name).bird, options, label:p.label};
}
/* Daily rounds come from the server in a fixed order; each player sees the tiles shuffled. */
function dailyRounds(quiz){
  return quiz.rounds.map(r => {
    const options = shuffle(r.options.map(o => ({bird:{name:o.name, sci:o.sci}, photo:{src:PHOTO(o.photo[0]), credit:o.photo[1], crop:o.photo[2] || ""}})));
    return {target:options.find(o => o.bird.name === r.target).bird, options, label:r.label};
  });
}

/* ---------- leaderboard (today only) ---------- */
let boards = {birds:[], fish:[]}, boardState = {birds:"loading", fish:"loading"}, boardMode = mode;
async function loadBoard(m = boardMode){
  try {
    const r = await fetch("/api/scores?mode=" + m, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    boards[m] = (await r.json()).top || []; boardState[m] = "ready";
  } catch(e) { boardState[m] = boards[m].length ? "ready" : "off"; }
  rerenderBoard();
}
/* Posts a finished daily run under the saved name and marks it posted. Called automatically, never by a button. */
const posting = {};
async function postRun(m, rec){
  if (!rec || !rec.done || rec.posted || rec.postFailed || !myName) return false;
  if (posting[m]) return posting[m];
  posting[m] = (async () => {
    const r = await fetch("/api/scores", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mode:m, day:rec.day, name:myName, score:rec.score, hits:rec.log.filter(l => l.ok).length})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok && r.status !== 409) {
      const msg = j.error || "Your score couldn't be posted.";
      if (r.status === 400 || r.status === 403) { rec.postFailed = msg; if (run === rec) saveRun(); else store.set(runKey(m), rec); }
      throw new Error(msg);
    }
    rec.posted = true; rec.postedName = myName; delete rec.postFailed;
    if (run === rec) saveRun(); else store.set(runKey(m), rec);
    return true;
  })().finally(() => { delete posting[m]; });
  return posting[m];
}
function boardHTML(withTabs = true){
  const m = boardMode, list = boards[m], st = boardState[m], me = myName.toLowerCase();
  const day = daily[m] ? dayLabel(daily[m].day) : "today";
  let body;
  if (st === "off") body = `<p class="note">Scores can't be reached right now.</p>`;
  else if (st === "loading") body = `<p class="note">Loading scores…</p>`;
  else if (!list.length) body = `<p class="note">No ${MODES[m].label.toLowerCase()} scores yet today. Finish today's quiz to take the top spot.</p>`;
  else body = `<ol>${list.map((b,i) => { const mine = me && b.name.toLowerCase() === me; return `<li class="${mine?"me":""}"><span class="r mono">${i+1}</span><span>${esc(b.name)}${mine?" (you)":""}</span><span class="mono">${fmt(b.score)}</span></li>`; }).join("")}</ol>`;
  const tabs = withTabs ? `<div class="seg" role="group" aria-label="Leaderboard">${Object.keys(MODES).map(k => `<button type="button" data-board="${k}" aria-pressed="${k===m}">${named(k)}</button>`).join("")}</div>` : "";
  return `<section class="board" id="board"><div class="head"><h2>${withTabs ? "Today's leaderboard" : MODES[m].label + " · today's leaderboard"}</h2>${tabs}</div><p class="note">${day} · resets at 4am Eastern</p>${body}</section>`;
}
function rerenderBoard(){ const el = document.getElementById("board"); if (!el) return; el.outerHTML = boardHTML(!run); wireBoard(); }
function wireBoard(){ document.querySelectorAll("[data-board]").forEach(b => b.onclick = () => { boardMode = b.dataset.board; rerenderBoard(); if (boardState[boardMode] !== "ready") loadBoard(boardMode); }); }

/* ---------- screens ---------- */
let run = null, timerId = null, rolloverTimer = null;
function errorScreen(label, msg, retry){
  app.innerHTML = `<div class="hero"><span class="label">${esc(label)}</span><p>${esc(msg)}</p><div class="row"><button class="btn" id="retry">Try again</button><button class="btn alt" id="home">Home</button></div></div>`;
  document.getElementById("retry").onclick = retry; document.getElementById("home").onclick = home;
}

function dailyCard(k){
  const v = MODES[k], d = daily[k], s = d && todaysRun(k);
  let tag = "Today", status = `${v.count} species. ${v.blurb}.`, action = "play";
  if (!d) { status = "Loading today's quiz…"; action = "none"; }
  else if (s && s.done) { tag = "Played"; action = "results"; status = `${s.log.filter(l => l.ok).length}/10 · ${fmt(s.score)} points${s.posted ? "" : s.postFailed ? " · couldn't be posted" : myName ? " · posting…" : " · add your name to post it"}. See your results.`; }
  else if (s) { tag = "Resume"; action = "resume"; status = `You're on round ${Math.min(s.i + 1 + (s.pending === s.i ? 1 : 0), ROUNDS)} of 10.`; }
  else if (d.status) { tag = "Played"; action = "none"; status = "You've already played today's quiz on this browser."; }
  return `<button class="mode ${k}" data-daily="${k}" data-action="${action}" ${action === "none" ? "disabled" : ""}><i>${tag}</i><strong>${named(k)}</strong><span>${status}</span></button>`;
}

async function home(){
  run = null; clearInterval(timerId); clearTimeout(rolloverTimer); boardMode = mode;
  document.documentElement.dataset.mode = mode;
  const render = () => {
    const left = daily.birds ? daily.birds.msLeft - (Date.now() - daily.birds.loadedAt) : null;
    app.innerHTML = `
    <div class="hero">
      <span class="label">Daily quiz${daily.birds ? " · " + dayLabel(daily.birds.day) : ""}</span>
      <h1>Wild <em>Guess</em></h1>
      <p>Everyone gets the same ten photos today. We name a species, you pick its photo out of four, and by round ten every choice is a lookalike. One try per day.</p>
    </div>
    <div class="modes">${Object.keys(MODES).map(dailyCard).join("")}</div>
    <div class="whoami">
      <p class="note">${left != null ? `Next quiz in <span class="mono">${untilText(Math.max(0,left))}</span> · 4am Eastern` : ""}</p>
      <p class="note">${myName ? `Playing as <strong>${esc(myName)}</strong> · <button type="button" class="link" id="rename">Change name</button>` : `<button type="button" class="link" id="rename">Set your leaderboard name</button>`}</p>
    </div>
    ${boardHTML()}
    <section class="practice">
      <div><strong>Practice</strong><span class="note">Unlimited random runs. Not on the leaderboard.</span></div>
      <div class="row">${Object.entries(MODES).map(([k,v]) => `<button class="btn alt" data-practice="${k}">${named(k)}</button>`).join("")}</div>
    </section>
    <div class="steps">
      <div><strong>Read the name</strong>Each round shows one species name.</div>
      <div><strong>Pick fast</strong>${SECONDS} seconds per round. Answering quicker earns more. Keys 1–4 work too.</div>
      <div><strong>Climb the board</strong>Later rounds are worth more, up to ${fmt(5500)} a run. Birds and fish have separate daily boards.</div>
    </div>`;
    document.querySelectorAll("[data-daily]").forEach(b => b.onclick = () => {
      const k = b.dataset.daily, a = b.dataset.action;
      if (a === "play") startDaily(k); else if (a === "resume") resumeDaily(k); else if (a === "results") showDailyResults(k);
    });
    document.querySelectorAll("[data-practice]").forEach(b => b.onclick = () => startPractice(b.dataset.practice));
    document.getElementById("rename").onclick = () => askName({label:"Leaderboard name", button:"Save", back:home, done:home});
    wireBoard();
  };
  render();
  loadBoard(mode);
  await Promise.all(Object.keys(MODES).map(k => loadDaily(k).catch(() => null)));
  if (run) return;
  render();
  // A finished run that never reached the board (closed tab, lost connection) posts itself now.
  const pending = Object.keys(MODES).filter(k => { const s = todaysRun(k); return s && s.done && !s.posted && !s.postFailed; });
  if (pending.length && myName) {
    await Promise.all(pending.map(k => postRun(k, todaysRun(k)).catch(() => null)));
    if (run) return;
    render(); loadBoard(boardMode);
  }
  const left = daily.birds && daily.birds.msLeft;
  if (left) rolloverTimer = setTimeout(() => { if (!run) home(); }, left + 2000);   // new quiz at 4am
}

function askName({label, button, back, done}){
  run = null; clearInterval(timerId);
  app.innerHTML = `
  <div class="hero">
    <span class="label">${esc(label)}</span>
    <h2 class="askname">What name should go on the leaderboard?</h2>
    <p>Daily scores post automatically under this name. It's saved on this device, and you can change it any time from the home screen.</p>
  </div>
  <form class="postform" id="nameform" novalidate>
    <label class="label" for="player">Your name</label>
    <div class="row"><input id="player" name="player" maxlength="20" autocomplete="nickname" placeholder="Your name" value="${esc(myName)}"><button class="btn big" type="submit">${esc(button)}</button></div>
    <p class="note" id="namemsg"></p>
  </form>
  <div class="row"><button class="btn alt" id="back">Back</button></div>`;
  const input = document.getElementById("player"), msg = document.getElementById("namemsg");
  input.focus();
  document.getElementById("back").onclick = back;
  document.getElementById("nameform").onsubmit = e => {
    e.preventDefault();
    if (!validName(input.value)) { msg.textContent = "Use up to 20 characters, including at least one letter or number."; msg.style.color = "var(--bad)"; return; }
    saveName(input.value); done();
  };
}

async function startDaily(m){
  if (!myName) return askName({label:`${named(m)} · today's quiz`, button:"Start quiz", back:home, done:() => startDaily(m)});
  setMode(m); boardMode = m;
  app.innerHTML = `<div class="hero"><span class="label">${MODES[m].label} · daily</span><p>Starting today's quiz…</p></div>`;
  try {
    const d = daily[m] || await loadDaily(m);
    const r = await fetch("/api/daily", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mode:m})});
    if (r.status === 409) { await loadDaily(m); return home(); }
    if (!r.ok) throw new Error(r.status);
    run = {kind:"daily", mode:m, day:d.day, rounds:dailyRounds(d.quiz), i:0, score:0, log:[], pending:null, done:false, posted:false, postedName:""};
    saveRun(); preload(run.rounds[1]); show();
  } catch(e) { errorScreen(MODES[m].label, "Today's quiz didn't load. Check your connection, then try again.", () => startDaily(m)); }
}
async function resumeDaily(m){
  setMode(m); boardMode = m;
  try {
    const d = await loadDaily(m), s = todaysRun(m);
    if (!s) return home();
    run = {kind:"daily", mode:m, day:d.day, rounds:dailyRounds(d.quiz), i:s.i, score:s.score, log:s.log, pending:s.pending, done:s.done, posted:s.posted, postedName:s.postedName || "", postFailed:s.postFailed};
    if (run.pending === run.i) {                 // left mid-round: that round counts as a miss
      run.log.push({name:run.rounds[run.i].target.name, ok:false, pts:0, picked:null, left:true});
      run.i++; run.pending = null;
    }
    if (run.i >= ROUNDS) { run.done = true; saveRun(); return finish(); }
    saveRun(); show();
  } catch(e) { errorScreen(MODES[m].label, "Today's quiz didn't load. Check your connection, then try again.", () => resumeDaily(m)); }
}
async function showDailyResults(m){
  try { await loadDaily(m); } catch(e) {}
  const s = todaysRun(m); if (!s) return home();
  setMode(m); boardMode = m;
  run = {kind:"daily", mode:m, day:s.day, rounds:[], i:s.i, score:s.score, log:s.log, pending:null, done:true, posted:s.posted, postedName:s.postedName || "", postFailed:s.postFailed};
  finish();
}
async function startPractice(m){
  setMode(m); boardMode = m;
  app.innerHTML = `<div class="hero"><span class="label">${MODES[m].label} · practice</span><p>Loading species…</p></div>`;
  try { SPECIES = await (await fetch("data/" + m + ".json")).json(); }
  catch(e) { return errorScreen(MODES[m].label, "The species list didn't load. Check your connection, then try again.", () => startPractice(m)); }
  const used = new Set(), rounds = [];
  for (let r=0;r<ROUNDS;r++){ const rd = buildPracticeRound(r, used); used.add(rd.target.name); rounds.push(rd); }
  run = {kind:"practice", mode:m, rounds, i:0, score:0, log:[]};
  preload(rounds[1]); show();
}

async function prepare(round){
  if (round.ready) return;
  let failed = 0;
  await Promise.all(round.options.map(o => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = () => { failed++; res(); }; im.src = o.photo.src; })));
  if (failed) throw new Error("photo");
  round.ready = true;
}
function preload(round){ if (round) prepare(round).catch(() => {}); }
async function show(){
  const rd = run.rounds[run.i];
  if (!rd.ready) {
    app.innerHTML = `<div class="hero"><span class="label">Round ${run.i+1}</span><p>Loading photos…</p></div>`;
    try { await prepare(rd); }
    catch(e) { return errorScreen("Round " + (run.i+1), "The photos didn't load. Check your connection, then try again.", show); }
  }
  play();
}
const modeTag = () => `${named(run.mode)} · ${run.kind === "daily" ? "Daily " + dayLabel(run.day) : "Practice"}`;

function play(){
  const rd = run.rounds[run.i], r = run.i + 1;
  preload(run.rounds[run.i+1]);
  if (run.kind === "daily") { run.pending = run.i; saveRun(); }
  app.innerHTML = `
  <div class="bar"><span class="brand">${modeTag()}</span>
    <div class="scorebox"><span class="label">Round <span class="mono">${r}/${ROUNDS}</span></span><span class="mono" id="score">${fmt(run.score)}</span></div></div>
  <div class="track">${run.rounds.map((_,k) => `<span class="${k<run.i?(run.log[k].ok?"ok":"miss"):k===run.i?"now":""}"></span>`).join("")}</div>
  <div class="prompt">
    <div class="meta"><span class="label">Find the</span><span class="tier t${rd.label}">${TIERS[rd.label]} · worth ${fmt(100*r)}</span></div>
    <h1 class="name">${esc(rd.target.name)}</h1>
    <div class="sci" id="sci"></div>
  </div>
  <div class="timer"><i id="bar"></i></div>
  <div class="grid" id="grid">${rd.options.map((o,k) => `
    <button class="tile" data-k="${k}" aria-label="Photo ${k+1}">
      <img src="${o.photo.src}" style="${cropStyle(o.photo.crop)}" alt="${MODES[run.mode].label} photo ${k+1}" decoding="async">
      <span class="key">${k+1}</span><span class="cap">${esc(o.bird.name)}</span>
    </button>`).join("")}</div>
  <div class="feedback" id="fb"><span class="note label">Tap the ${esc(rd.target.name)}</span></div>`;
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => answer(+b.dataset.k));
  const t0 = performance.now(), bar = document.getElementById("bar");
  run.t0 = t0; run.locked = false;
  clearInterval(timerId);
  timerId = setInterval(() => {
    const left = Math.max(0, 1 - (performance.now()-t0)/(SECONDS*1000));
    bar.style.transform = `scaleX(${left})`;
    if (left <= 0) answer(-1);
  }, 50);
}

function answer(k){
  if (!run || run.locked) return;
  run.locked = true; clearInterval(timerId);
  const rd = run.rounds[run.i], r = run.i + 1;
  const elapsed = (performance.now() - run.t0)/1000;
  const correctIdx = rd.options.findIndex(o => o.bird.name === rd.target.name);
  const ok = k === correctIdx;
  const pts = ok ? Math.round(100*r*(0.5 + 0.5*Math.max(0, 1 - elapsed/SECONDS))) : 0;
  run.score += pts;
  run.log.push({name:rd.target.name, ok, pts, picked: k>=0 ? rd.options[k].bird.name : null});
  const last = run.i === ROUNDS - 1;
  if (run.kind === "daily") { run.pending = null; run.i++; if (last) run.done = true; saveRun(); run.i--; }

  const grid = document.getElementById("grid");
  grid.classList.add("revealed");
  grid.querySelectorAll(".tile").forEach((b,i) => {
    b.disabled = true;
    if (i === correctIdx) { b.classList.add("right"); b.insertAdjacentHTML("beforeend", `<span class="badge">${ok?"+"+pts:"ANSWER"}</span>`); }
    else if (i === k) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", `<span class="badge">YOURS</span>`); }
  });
  document.getElementById("score").textContent = fmt(run.score);
  document.getElementById("sci").textContent = rd.target.sci;
  const verdict = ok ? `Got it · +${pts}` : k < 0 ? "Time's up" : `That's a ${rd.options[k].bird.name}`;
  document.getElementById("fb").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">
      <span class="verdict ${ok?"ok":"no"}">${esc(verdict)}</span>
      <span class="credit">Photo of ${esc(rd.target.name)}: ${esc(rd.options[correctIdx].photo.credit)} · via iNaturalist</span>
    </div>
    <button class="btn" id="next">${last ? "See results" : "Next round"} →</button>`;
  const nx = document.getElementById("next");
  nx.onclick = () => { run.i++; last ? finish() : show(); };
  nx.focus({preventScroll:true});
}

function shareText(){
  const hits = run.log.filter(l => l.ok).length;
  return `Wild Guess ${MODES[run.mode].emoji} ${MODES[run.mode].label} · ${dayLabel(run.day)}\n${hits}/10 · ${fmt(run.score)} pts\n${run.log.map(l => l.ok ? "🟩" : "🟥").join("")}\n${SITE}`;
}
async function share(btn, msg){
  const text = shareText();
  if (navigator.share && matchMedia("(pointer: coarse)").matches) {
    try { await navigator.share({text}); return; } catch(e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); msg.textContent = "Copied. Paste it into a text or group chat."; }
  catch(e) {
    const box = document.getElementById("sharebox"); const range = document.createRange(); range.selectNodeContents(box);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    msg.textContent = "Selected. Copy it with your keyboard or the copy menu.";
  }
}

function finish(){
  clearInterval(timerId);
  const hits = run.log.filter(l => l.ok).length, score = run.score, m = run.mode, isDaily = run.kind === "daily";
  const postBlock = !isDaily ? `<p class="note">Practice run · not on the leaderboard.</p>`
    : `<div id="poststatus">${postStatusHTML()}</div>`;
  app.innerHTML = `
  <div class="bar"><span class="brand">${modeTag()}</span><span class="label">Run complete</span></div>
  <div class="hero" style="gap:6px">
    <span class="label">Final score · ${hits}/10 correct</span>
    <div class="final mono">${fmt(score)}</div>
    ${isDaily ? `<div class="squares" aria-label="${hits} of 10 correct">${run.log.map(l => `<i class="${l.ok?"ok":"miss"}"></i>`).join("")}</div>` : ""}
  </div>
  ${postBlock}
  ${isDaily ? `<section class="share">
    <pre id="sharebox">${esc(shareText())}</pre>
    <div class="row"><button class="btn big" id="sharebtn">Share result</button><span class="note" id="sharemsg"></span></div>
  </section>` : ""}
  <div class="row">${isDaily ? "" : `<button class="btn big" id="again">Play again</button>`}<button class="btn alt" id="home">Home</button>${isDaily ? `<button class="btn alt" id="practice">Practice ${MODES[m].label.toLowerCase()}</button>` : ""}</div>
  ${isDaily ? boardHTML(false) : ""}
  ${run.log.length ? `<section><span class="label">Your run</span>
  <table class="log"><tbody>${run.log.map((l,i) => `<tr>
    <td class="mono" style="color:var(--muted);width:2em">${i+1}</td>
    <td>${esc(l.name)}${!l.ok?`<div class="credit">${l.left?"Left mid-round":l.picked?"Picked "+esc(l.picked):"Ran out of time"}</div>`:""}</td>
    <td class="mono ${l.ok?"y":"x"}">${l.ok?"+"+fmt(l.pts):"0"}</td></tr>`).join("")}</tbody></table></section>` : ""}`;
  document.getElementById("home").onclick = home;
  if (!isDaily) { document.getElementById("again").onclick = () => startPractice(m); return; }
  document.getElementById("practice").onclick = () => startPractice(m);
  const sbtn = document.getElementById("sharebtn"), smsg = document.getElementById("sharemsg");
  sbtn.onclick = () => share(sbtn, smsg);
  autoPost();
  loadBoard(m);
}

function postStatusHTML(err){
  if (run.posted) return `<p class="verdict ok">On today's leaderboard as ${esc(run.postedName || myName)}.</p>`;
  if (run.postFailed) return `<p class="note" style="color:var(--bad)">${esc(run.postFailed)}</p>`;
  if (err) return `<p class="note" style="color:var(--bad)">${esc(err)}</p><div class="row"><button class="btn" id="retrypost">Try again</button></div>`;
  if (myName) return `<p class="note">Posting to today's leaderboard as ${esc(myName)}…</p>`;
  return `<form class="postform" id="nameform" novalidate>
      <label class="label" for="player">Add your name to post this score</label>
      <div class="row"><input id="player" name="player" maxlength="20" autocomplete="nickname" placeholder="Your name"><button class="btn" type="submit">Save name</button></div>
      <p class="note" id="namemsg">You'll only need to do this once.</p>
    </form>`;
}
async function autoPost(){
  const rec = run, box = () => document.getElementById("poststatus");
  const paint = err => { if (run !== rec || !box()) return; box().innerHTML = postStatusHTML(err); wirePost(); };
  if (!rec || rec.kind !== "daily" || !rec.done || rec.posted || rec.postFailed) return paint();
  if (!myName) return paint();
  paint();
  try { await postRun(rec.mode, rec); paint(); if (run === rec) loadBoard(rec.mode); }
  catch(e) { paint(e.message); }
}
function wirePost(){
  const retry = document.getElementById("retrypost"); if (retry) retry.onclick = autoPost;
  const form = document.getElementById("nameform"); if (!form) return;
  form.onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById("player"), msg = document.getElementById("namemsg");
    if (!validName(input.value)) { msg.textContent = "Use up to 20 characters, including at least one letter or number."; msg.style.color = "var(--bad)"; return; }
    saveName(input.value); autoPost();
  };
}

/* Phones and sleeping laptops pause background tabs, so a page left open overnight can miss the 4am rollover
   timer. Whenever the page comes back into view, reload if the day has turned, otherwise refresh the board. */
function dayHasTurned(){ const d = daily.birds || daily.fish; return !!d && Date.now() >= d.loadedAt + d.msLeft; }
function onReturn(){
  if (document.visibilityState !== "visible") return;
  if (dayHasTurned()) { if (!run) location.reload(); return; }   // mid-run: home() fetches the new day when they get there
  if (!run) loadBoard(boardMode);
}
document.addEventListener("visibilitychange", onReturn);
window.addEventListener("pageshow", e => { if (e.persisted) onReturn(); });

document.addEventListener("keydown", e => {
  if (!run || !run.rounds.length || e.metaKey || e.ctrlKey) return;
  if (!run.locked && "1234".includes(e.key)) answer(+e.key - 1);
});
home();
</script>
